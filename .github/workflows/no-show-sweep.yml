name: No-show charge sweep

# No-show charges waiting on the guest's bank (3DS): emails a reminder after
# 48h and closes the charge after 7 days (and tells the hotel). Uses the same
# repo secrets as the wholesale import. Skips quietly if they aren't set.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sweep
        env:
          API: ${{ secrets.BACKEND_API_URL }}
          SECRET: ${{ secrets.WHOLESALE_CRON_SECRET }}
        run: |
          if [ -z "$API" ] || [ -z "$SECRET" ]; then
            echo "BACKEND_API_URL / WHOLESALE_CRON_SECRET not set — skipping."
            exit 0
          fi
          curl -fsS -X POST "$API/api/payments/no-show/sweep" \
            -H "x-cron-secret: $SECRET" --max-time 120
