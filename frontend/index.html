<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fix the title -->
    <title>Deadline — Life is short. Travel now.</title>

    <!-- Favicon + link preview image -->
    <link rel="icon" type="image/png" href="/Favicon.png" />

    <!-- SEO -->
    <meta
      name="description"
      content="Student-only blind bidding for hotel rooms. Verify your .edu, name your price, get instant accept or reject. Life is short. Travel now."
    />
    <meta
      name="keywords"
      content="student travel, cheap hotels, hotel bidding, .edu discount, student deals"
    />

    <!-- Open Graph (for sharing on social / iMessage previews) -->
    <meta property="og:title" content="Death is a Deadline" />
    <meta
      property="og:description"
      content="Life is short. Travel now. Student-only blind bidding for hotel rooms."
    />
    <meta property="og:image" content="/Favicon.png" />
    <meta
      property="og:url"
      content="https://death-is-a-deadline-mvp.vercel.app/"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter/X card (important for viral sharing) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Death is a Deadline" />
    <meta
      name="twitter:description"
      content="Student-only hotel bidding. Name your price. Life is short. Travel now."
    />
    <meta name="twitter:image" content="/Favicon.png" />

    <!-- Hide skip link until keyboard focus (before app CSS loads) -->
    <style>
      a.skip-link {
        position: absolute !important;
        left: -10000px !important;
        top: auto !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
      }
      a.skip-link:focus,
      a.skip-link:focus-visible {
        position: fixed !important;
        left: 1rem !important;
        top: 1rem !important;
        z-index: 100000 !important;
        width: auto !important;
        height: auto !important;
        clip: auto !important;
        overflow: visible !important;
        padding: 0.65rem 1rem !important;
        border-radius: 0.5rem !important;
        background: #c9a227 !important;
        color: #0a0a0a !important;
        font: 600 0.875rem/1.25 system-ui, sans-serif !important;
        text-decoration: none !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45) !important;
        outline: 2px solid #e8c84a !important;
        outline-offset: 2px !important;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" id="skip-to-main"
      >Skip to main content</a
    >
    <div id="root"></div>
    <script>
      document.getElementById("skip-to-main")?.addEventListener("click", function (e) {
        var main = document.getElementById("main-content");
        if (!main) return;
        e.preventDefault();
        main.setAttribute("tabindex", "-1");
        main.focus();
        main.scrollIntoView({ block: "start" });
        history.replaceState(
          null,
          "",
          location.pathname + location.search + "#main-content",
        );
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
